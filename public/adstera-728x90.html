<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Advertisement</title>
    <style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}</style>
  </head>
  <body>
    <script>
      if (window.self !== window.top) {
        const reportRenderedAd = () => {
          const creative = Array.from(document.querySelectorAll(
            'iframe, img, video, canvas, object, embed, a[href], [onclick], [role="link"]'
          ))
            .find((element) => {
              const rect = element.getBoundingClientRect();
              return rect.width >= 100 && rect.height >= 50;
            });

          if (creative) {
            window.parent.postMessage({ type: 'loot-terminal-ad-rendered' }, '*');
            adObserver.disconnect();
          }
        };
        const adObserver = new MutationObserver(() => requestAnimationFrame(reportRenderedAd));
        adObserver.observe(document.body, { childList: true, subtree: true });

        atOptions = {
          'key' : '492f311c62b522d0a0f8a5914220812b',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
        document.write('<scr' + 'ipt data-cfasync="false" src="https://www.highrevenueformat.com/492f311c62b522d0a0f8a5914220812b/invoke.js"></scr' + 'ipt>');
      }
    </script>
  </body>
</html>
